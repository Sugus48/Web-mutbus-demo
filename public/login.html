<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · MUT Shuttle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-layout="auth">
<main class="" id="main">
<h2>เข้าสู่ระบบ</h2>
<form id="login-form" novalidate>
  <div data-form-error></div>
  <div class="field">
    <label for="username">Username</label>
    <input class="input" id="username" name="username" autocomplete="username" autofocus required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="input-group">
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-sm btn-ghost" type="button" data-toggle-password="password" aria-pressed="false">แสดง</button>
    </div>
  </div>
  <button class="btn btn-primary btn-block" type="submit" data-loading="กำลังเข้าสู่ระบบ...">เข้าสู่ระบบ</button>
</form>
<p class="muted" style="text-align:center; margin-bottom:0">ยังไม่มีบัญชี? <a href="/register">สมัครสมาชิก</a></p>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
