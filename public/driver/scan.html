<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สแกน QR · MUT Shuttle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-layout="driver">
<main class="app-main" id="main">
<a class="back-link" id="back-link" href="/driver/" data-icon="back">รายละเอียดรอบ</a>

<div class="page-head row-between">
  <div>
    <h1 class="mb-0">สแกน QR</h1>
    <div class="muted" id="trip-info"></div>
  </div>
  <div class="right">
    <div class="small muted">Check-in แล้ว</div>
    <div style="font-size:1.4rem;font-weight:700" id="checkin-count">-</div>
  </div>
</div>

<div id="scan-result"></div>
<div id="scan-blocked"></div>

<div id="scan-area" hidden>
  <div class="card">
    <div id="reader" class="scanner" aria-label="ภาพจากกล้องสำหรับสแกน QR"></div>
    <p class="center small muted mt-2 mb-2" id="cam-status">กดปุ่มเพื่อเปิดกล้อง แล้วหัน QR Code ของผู้โดยสารเข้ากล้อง</p>
    <button class="btn btn-primary btn-block" type="button" id="cam-btn" data-icon="qr">เปิดกล้องสแกน</button>
  </div>

  <form class="card" id="checkin-form" novalidate>
    <div class="field mb-2">
      <label for="qr">หรือกรอกรหัส QR</label>
      <input class="input mono" id="qr" name="qr" placeholder="เช่น QR-BD001-XXXXXXXX" autocomplete="off" required>
    </div>
    <button class="btn btn-block" type="submit" data-loading="กำลังตรวจสอบ...">Check-in</button>
  </form>
</div>
</main>
<script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/js/pages/driver-scan.js"></script>
</body>
</html>
