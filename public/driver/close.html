<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปิดงาน · BusBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-layout="driver">
<main class="app-main" id="main">
<a class="back-link" id="back-link" href="/driver/" data-icon="back">รายละเอียดรอบ</a>

<div class="page-head">
  <h1 class="mb-0">ปิดงาน</h1>
  <div class="muted" id="trip-info"></div>
</div>

<div class="kpis" style="grid-template-columns:repeat(2,1fr);margin-bottom:var(--s4)">
  <div class="kpi"><div class="k-label">ผู้ใช้บริการจริง</div><div class="k-value" style="color:var(--success)"><span id="k-checked">-</span> <span class="small muted">คน</span></div></div>
  <div class="kpi"><div class="k-label">จะถูกบันทึกเป็น No Show</div><div class="k-value" style="color:var(--warning)"><span id="k-noshow">-</span> <span class="small muted">รายการ</span></div></div>
</div>

<h2 class="section-title">รายชื่อ No Show (ยังไม่ Check-in)</h2>
<div id="noshow-list"></div>

<button class="btn btn-danger btn-block mt-5" type="button" id="close-btn" disabled>ปิดงาน</button>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/driver-close.js"></script>
</body>
</html>
