<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผู้ใช้งาน / พนักงาน · BusBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-layout="admin">
<main class="admin-content" id="main">
<div class="page-bar">
  <h1>ผู้ใช้งาน / พนักงาน</h1>
  <a class="btn btn-primary" id="add-btn" href="/admin/user-form" hidden>+ เพิ่มผู้ใช้งาน</a>
</div>

<form class="filters" id="filter-form" role="search">
  <div class="field wide">
    <label for="q">ค้นหา</label>
    <input class="input" id="q" name="q" placeholder="รหัส, ชื่อ, email, username">
  </div>
  <div class="field">
    <label for="department">แผนก</label>
    <select class="input" id="department" name="department"></select>
  </div>
  <div class="field">
    <label for="position">ตำแหน่ง</label>
    <select class="input" id="position" name="position"></select>
  </div>
  <div class="field">
    <label for="type">ประเภท</label>
    <select class="input" id="type" name="type">
      <option value="">ทั้งหมด</option>
      <option value="employee">พนักงาน</option>
      <option value="user">ผู้ใช้บริการทั่วไป</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn" type="submit">ค้นหา</button>
    <a class="btn btn-ghost" href="/admin/users">ล้าง</a>
  </div>
</form>

<div id="rows"><div class="card empty">กำลังโหลด...</div></div>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/admin-users.js"></script>
</body>
</html>
