<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เส้นทาง · BusBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-layout="admin">
<main class="admin-content" id="main">
<a class="back-link" id="back-link" href="/admin/routes" data-icon="back">เส้นทาง</a>
<div class="page-bar"><h1 id="form-title">เพิ่มเส้นทาง</h1></div>

<form class="card form-card" id="route-form" novalidate>
  <div data-form-error></div>
  <div class="field">
    <label for="route_name">ชื่อเส้นทาง</label>
    <input class="input" id="route_name" name="route_name" required maxlength="100">
  </div>

  <div class="row-between mb-2">
    <span class="label">ลำดับจุดจอด</span>
    <span class="small muted">ลากที่ ⠿ หรือใช้ปุ่ม ↑ ↓ เพื่อเรียงลำดับ · เลือกจุดจอดซ้ำได้</span>
  </div>
  <div data-error-for="stops"></div>

  <div id="rows"></div>
  <button class="btn btn-sm mt-2" type="button" id="add-row">+ เพิ่มจุดจอด</button>

  <div class="card mt-4" style="background:var(--surface-2)">
    <div class="row-between"><span>เวลารวมของเส้นทาง (คำนวณอัตโนมัติ)</span><b style="font-size:1.3rem"><output id="total">0</output> นาที</b></div>
  </div>

  <p class="small muted mt-2" id="edit-note" hidden>การแก้ลำดับจุดจอดมีผลกับเวลาถึงของทุกรอบในเส้นทางนี้</p>
  <div class="btn-row end mt-4">
    <a class="btn" id="cancel-btn" href="/admin/routes">ยกเลิก</a>
    <button class="btn btn-primary" type="submit" data-loading="กำลังบันทึก...">บันทึก</button>
  </div>
</form>

<template id="row-template">
  <div class="repeat-row" draggable="true">
    <span class="handle" aria-hidden="true">⠿</span>
    <span class="order"></span>
    <select class="input" name="stop_id" aria-label="จุดจอด" required></select>
    <span class="minutes row" style="gap:6px;flex-wrap:nowrap">
      <input class="input" type="number" name="minutes" min="0" aria-label="เวลาเดินทางจากจุดก่อนหน้า (นาที)" style="max-width:90px">
      <span class="small muted">นาที</span>
    </span>
    <span class="row" style="gap:2px;flex-wrap:nowrap">
      <button class="btn btn-sm btn-ghost" type="button" data-move="-1" aria-label="เลื่อนขึ้น">↑</button>
      <button class="btn btn-sm btn-ghost" type="button" data-move="1" aria-label="เลื่อนลง">↓</button>
      <button class="btn btn-sm btn-ghost" type="button" data-remove aria-label="ลบจุดจอดนี้" style="color:var(--danger)">✕</button>
    </span>
  </div>
</template>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/admin-route-form.js"></script>
</body>
</html>
